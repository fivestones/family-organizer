# What reaches a device. Each stream is a set of queries, and a device receives the rows they select for the claims
# in its token. Every query names its columns, so a column that must stay on the server cannot be sent by accident.
config:
  edition: 3
  # A timestamp reaches a device exactly as toISOString() writes one.
  timestamp_max_precision: milliseconds

streams:
  # Everything any signed-in member of the family may see.
  family:
    auto_subscribe: true
    queries:
      # PowerSync needs a text column named id; a setting's is its name.
      - SELECT name AS id, value FROM settings
      - SELECT id, code, name, symbol, is_monetary, symbol_placement, symbol_spacing, decimal_places FROM unit_definitions
      # Without pin_hash. Devices learn only whether a PIN is set.
      - >-
        SELECT id, name, role, email, color, photo_urls, sort_order, has_pin,
        allowance_amount, allowance_currency, allowance_rrule, allowance_start_date, allowance_payout_delay_days, allowance_config,
        last_display_currency, view_show_chore_descriptions, view_show_task_details,
        message_quiet_hours_enabled, message_quiet_hours_start, message_quiet_hours_end, message_digest_mode, message_digest_window_minutes
        FROM family_members
      - >-
        SELECT id, title, description, start_date, rrule, exdates, pause_state,
        rotation_type, is_joint, is_up_for_grabs, hide_from_day_list, sort_order,
        weight, reward_type, reward_amount, reward_currency, estimated_duration_secs,
        timing_mode, timing_window_key, timing_time, timing_start_time, timing_end_time,
        timing_marker_key, timing_chore_id, timing_event, timing_fallback_time, created_at
        FROM chores
      # A join table has two columns for a key; its id is built from them.
      - SELECT chore_id || '.' || family_member_id AS id, chore_id, family_member_id, position FROM chore_assignees
      - SELECT id, chore_id, completed_by, marked_by, date_due, completed_at, not_done, allowance_awarded FROM chore_completions
      - SELECT id, name, on_step_overrun, sort_order, created_at FROM routines
      - SELECT routine_id || '.' || chore_id AS id, routine_id, chore_id, position FROM routine_steps
      - SELECT day || '.' || marker_key AS id, day, marker_key, started_at, started_by, completed_at, completed_by FROM routine_marker_statuses
      - >-
        SELECT id, family_member_id, day, routine_id, status, current_chore_id, skipped_chore_ids, started_at, step_started_at,
        step_extension_secs, step_extension_count, last_interaction_at, stopped_at, stopped_reason
        FROM countdown_runs
      - >-
        SELECT id, occurred_at, domain, action_type, summary, source, actor_id, chore_id, task_series_id, task_id, calendar_item_id,
        allowance_transaction_id, message_thread_id, message_id, scheduled_for, restore_timing, metadata
        FROM history_events
      - SELECT history_event_id || '.' || family_member_id AS id, history_event_id, family_member_id FROM history_event_members
      # Task series, with what was said and handed in.
      - SELECT id, name, kind, low_value, high_value, low_label, high_label, steps, is_default, sort_order, created_at, updated_at FROM grade_types
      - >-
        SELECT id, name, description, family_member_id, chore_id, depends_on_series_id, start_date, target_end_date, planned_end_date,
        baseline_day_break_count, work_ahead_allowed, pull_forward_count, break_type, break_start_date, break_delay_value, break_delay_unit,
        created_at, updated_at
        FROM task_series
      - >-
        SELECT id, task_series_id, parent_task_id, title, notes, sort_order, indentation_level, is_day_break, weight, specific_time, override_work_ahead,
        workflow_state, last_active_state, child_tasks_complete, completed_at, completed_on, deferred_until, noted_until, is_noted_indefinitely,
        created_at, updated_at
        FROM tasks
      - >-
        SELECT id, task_id, name, type, url, kind, size_bytes, width, height, duration_sec, thumbnail_url, thumbnail_width, thumbnail_height, blurhash,
        waveform_peaks, created_at, updated_at
        FROM task_attachments
      - SELECT id, task_id, type, label, description, weight, required, sort_order, created_at, updated_at FROM task_response_fields
      - >-
        SELECT id, task_id, actor_id, affected_person_id, reply_to_id, from_state, to_state, note, is_draft, scheduled_for, restore_timing, grade_type_id,
        grade_numeric_value, grade_display_value, grade_is_provisional, created_at, updated_at
        FROM task_updates
      - >-
        SELECT id, update_id, name, type, url, kind, size_bytes, width, height, duration_sec, thumbnail_url, thumbnail_width, thumbnail_height, blurhash,
        waveform_peaks, created_at, updated_at
        FROM task_update_attachments
      - >-
        SELECT id, update_id, field_id, rich_text_content, file_url, file_name, file_type, file_size_bytes, thumbnail_url, created_at, updated_at
        FROM task_response_field_values

  # What the server refused, for the person who made the write.
  refusals_member:
    auto_subscribe: true
    query: >-
      SELECT id, family_member_id, mutation, reason, table_name, row_id, refused_at, dismissed_at
      FROM write_refusals WHERE family_member_id = auth.parameter('family_member_id')

  # A parent sees everyone's.
  refusals_parent:
    auto_subscribe: true
    query: >-
      SELECT id, family_member_id, mutation, reason, table_name, row_id, refused_at, dismissed_at
      FROM write_refusals WHERE auth.parameter('type') = 'parent'
