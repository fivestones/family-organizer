services:
  # --- 1. Family Organizer App ---
  family-organizer:
    container_name: family-organizer
    image: family-organizer:latest
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
      # These bake the PUBLIC URLs into the JavaScript bundle at build time.
      # Changing these requires running `docker compose up -d --build`.
      args:
        NEXT_PUBLIC_S3_ENDPOINT: ${NEXT_PUBLIC_S3_ENDPOINT:-}
        NEXT_PUBLIC_INSTANT_API_URI: ${NEXT_PUBLIC_INSTANT_API_URI:-}
        NEXT_PUBLIC_INSTANT_WEBSOCKET_URI: ${NEXT_PUBLIC_INSTANT_WEBSOCKET_URI:-}
        NEXT_PUBLIC_INSTANT_APP_ID: ${NEXT_PUBLIC_INSTANT_APP_ID:-}
    # No ports needed when using a reverse proxy (e.g. SWAG) on the same Docker network —
    # it can reach this container directly as http://family-organizer:3000.
    # To expose the app directly on the host instead, uncomment:
    # ports:
    #   - '7654:3000'
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    environment:
      # --- Server-Side Config (Internal Docker Network) ---
      # The server uses the internal container name "minio".
      # This keeps traffic inside the docker network and avoids SSL overhead internally.
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET_NAME=family-organizer
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - DEVICE_ACCESS_KEY=${DEVICE_ACCESS_KEY}
      # Node environment settings
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
    depends_on:
      - minio
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health', { cache: 'no-store' }).then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))",
        ]
      start_period: 10s
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - default
      # Where Postgres is, once the `powersync` profile is in use. Without the profile this network is empty.
      - data

  # --- 1a. Apple Calendar Sync Worker ---
  family-organizer-calendar-sync-worker:
    container_name: family-organizer-calendar-sync-worker
    image: family-organizer:latest
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_S3_ENDPOINT: ${NEXT_PUBLIC_S3_ENDPOINT:-}
        NEXT_PUBLIC_INSTANT_API_URI: ${NEXT_PUBLIC_INSTANT_API_URI:-}
        NEXT_PUBLIC_INSTANT_WEBSOCKET_URI: ${NEXT_PUBLIC_INSTANT_WEBSOCKET_URI:-}
        NEXT_PUBLIC_INSTANT_APP_ID: ${NEXT_PUBLIC_INSTANT_APP_ID:-}
    command: ["node", "scripts/apple-calendar-sync-worker.js"]
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    environment:
      - NODE_ENV=production
      - APPLE_CALDAV_POLL_TARGET_URL=http://family-organizer:3000
    depends_on:
      family-organizer:
        condition: service_healthy
    networks:
      - default

  # --- 2. MinIO (S3 Compatible Storage) ---
  minio:
    image: minio/minio
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - '${MINIO_PORT}:9000'        # API Port
      - '${MINIO_CONSOLE_PORT}:9001' # Console Port
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY_ID}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_ACCESS_KEY}
      # CRITICAL: Tells MinIO its public identity so Presigned URLs use the domain, not the container IP
      - MINIO_SERVER_URL=${NEXT_PUBLIC_S3_ENDPOINT}
      # Uncomment if you reverse-proxy the MinIO console (e.g. via SWAG/nginx):
      # - MINIO_BROWSER_REDIRECT_URL=${MINIO_BROWSER_REDIRECT_URL}
    volumes:
      - minio_data:/data
    networks:
      - default
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 20s
      retries: 3

  # --- 3. Create Buckets (One-off initialization) ---
  createbuckets:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    entrypoint: |
      /bin/sh -c "
      # Connect to MinIO
      until /usr/bin/mc alias set myminio http://minio:9000 \${S3_ACCESS_KEY_ID} \${S3_SECRET_ACCESS_KEY}; do
        echo '...waiting for minio...';
        sleep 1;
      done;

      # Create bucket and set public download policy
      /usr/bin/mc mb -p myminio/family-organizer;
      /usr/bin/mc anonymous set download myminio/family-organizer;

      echo 'Bucket setup complete.'
      exit 0;
      "
    networks:
      - default

  # --- 4. Postgres and PowerSync ---
  # The app is moving off InstantDB onto these (docs/powersync-migration.md). They start only with
  # `docker compose --profile powersync up -d`; without the profile nothing here changes and the app runs on
  # InstantDB as before. `node scripts/powersync/setup-env.mjs` prints the variables they need.
  # Neither has a fixed container name, and Postgres is on a network private to this project, so a second copy of
  # the project, for staging, can run beside the first. Give that copy its own POWERSYNC_HOST_ALIAS.
  fo-postgres:
    image: postgres:17-alpine
    profiles: ["powersync"]
    restart: unless-stopped
    # wal_level=logical lets PowerSync read changes as they happen. The cap stops a PowerSync that has been down
    # for a long time from making Postgres keep its log until the disk is full: past the cap Postgres drops
    # PowerSync's place in the log, and PowerSync copies the tables afresh when it returns.
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_slot_wal_keep_size=2GB"]
    environment:
      - POSTGRES_USER=family_organizer
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-}
      - POSTGRES_DB=family_organizer
      - POWERSYNC_DB_PASSWORD=${POWERSYNC_DB_PASSWORD:-}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Run once, on the first start: PowerSync's own database and the role it reads through.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U family_organizer -d family_organizer"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Only on the private network: nothing on the reverse proxy's network can reach the database.
    networks:
      - data

  fo-powersync:
    image: journeyapps/powersync-service:1.26.1
    profiles: ["powersync"]
    restart: unless-stopped
    command: ["start", "-r", "unified"]
    depends_on:
      fo-postgres:
        condition: service_healthy
    environment:
      - POWERSYNC_CONFIG_PATH=/config/service.yaml
      - NODE_OPTIONS=--max-old-space-size=400
      - PS_DATA_SOURCE_URI=postgres://powersync:${POWERSYNC_DB_PASSWORD:-}@fo-postgres:5432/family_organizer
      - PS_STORAGE_SOURCE_URI=postgres://powersync:${POWERSYNC_DB_PASSWORD:-}@fo-postgres:5432/powersync_storage
      - PS_PORT=8080
      # The public half of the key the app signs device tokens with.
      - PS_JWK_N=${POWERSYNC_JWK_N:-}
      - PS_JWK_E=${POWERSYNC_JWK_E:-}
      - PS_JWK_KID=${POWERSYNC_JWT_KID:-}
    volumes:
      - ./powersync:/config:ro
    mem_limit: 512m
    # Devices reach this service at /powersync/ on the app's own address. The reverse proxy sends that path here
    # (http://family-organizer-powersync:8080 unless POWERSYNC_HOST_ALIAS says otherwise) with the prefix removed,
    # WebSocket upgrades passed and response buffering off. In nginx:
    #   location /powersync/ {
    #       proxy_pass http://family-organizer-powersync:8080/;
    #       proxy_http_version 1.1;
    #       proxy_set_header Upgrade $http_upgrade;
    #       proxy_set_header Connection "upgrade";
    #       proxy_buffering off;
    #       proxy_read_timeout 1h;
    #   }
    networks:
      data:
      default:
        aliases:
          - ${POWERSYNC_HOST_ALIAS:-family-organizer-powersync}

  # --- 5. The nightly jobs ---
  # None of these runs on its own. scripts/powersync/nightly.sh starts each in turn from the host's scheduler:
  # a backup, its copy off this machine, and the compaction PowerSync asks for.
  fo-backup:
    image: postgres:17-alpine
    profiles: ["maintenance"]
    depends_on:
      fo-postgres:
        condition: service_healthy
    entrypoint: ["sh", "/backup.sh"]
    environment:
      - PGHOST=fo-postgres
      - PGUSER=family_organizer
      - PGPASSWORD=${POSTGRES_PASSWORD:-}
      - PGDATABASE=family_organizer
      # A dump older than this many days is deleted, here and nowhere else: the copies off the machine are kept.
      - BACKUP_KEEP_DAYS=${BACKUP_KEEP_DAYS:-14}
    volumes:
      # Every dump is the whole family's data. Keep this directory out of anything that is shared or published.
      - ${BACKUP_DIR:-./backups}:/backups
      - ./scripts/powersync/backup.sh:/backup.sh:ro
    networks:
      - data

  # Copies the dumps to an rclone remote, which can be almost anywhere, and can encrypt them on the way with a
  # `crypt` remote. It only ever adds: a dump deleted here stays where it was copied to. Where the machine's own
  # backup already takes the folder, BACKUP_OFFSITE_REMOTE=external says so and this does nothing.
  fo-offsite:
    image: rclone/rclone:1.73.1
    profiles: ["maintenance"]
    entrypoint:
      - sh
      - -c
      - |
        if [ -z "$$BACKUP_OFFSITE_REMOTE" ]; then
          echo "BACKUP_OFFSITE_REMOTE is not set: the backups are not being copied off this machine." >&2
          exit 3
        fi
        if [ "$$BACKUP_OFFSITE_REMOTE" = "external" ]; then
          echo "Something outside the app copies the backup folder elsewhere (BACKUP_OFFSITE_REMOTE=external). Nothing to do."
          exit 3
        fi
        exec rclone copy --ignore-existing /backups "$$BACKUP_OFFSITE_REMOTE"
    environment:
      - BACKUP_OFFSITE_REMOTE=${BACKUP_OFFSITE_REMOTE:-}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups:ro
      - ${RCLONE_CONFIG_DIR:-./rclone}:/config/rclone:ro

  fo-powersync-compact:
    image: journeyapps/powersync-service:1.26.1
    profiles: ["maintenance"]
    depends_on:
      fo-postgres:
        condition: service_healthy
    command: ["compact"]
    environment:
      - POWERSYNC_CONFIG_PATH=/config/service.yaml
      - PS_DATA_SOURCE_URI=postgres://powersync:${POWERSYNC_DB_PASSWORD:-}@fo-postgres:5432/family_organizer
      - PS_STORAGE_SOURCE_URI=postgres://powersync:${POWERSYNC_DB_PASSWORD:-}@fo-postgres:5432/powersync_storage
      - PS_PORT=8080
      - PS_JWK_N=${POWERSYNC_JWK_N:-}
      - PS_JWK_E=${POWERSYNC_JWK_E:-}
      - PS_JWK_KID=${POWERSYNC_JWT_KID:-}
    volumes:
      - ./powersync:/config:ro
    networks:
      - data

volumes:
  minio_data:
  postgres_data:

# Join an existing external network (e.g. for reverse proxying via SWAG/nginx).
# Set DOCKER_NETWORK_NAME in your .env to match the network your reverse proxy uses.
networks:
  default:
    name: ${DOCKER_NETWORK_NAME:-docker_default}
    external: true
  # Private to this project. Postgres is reachable from here and nowhere else.
  data:
